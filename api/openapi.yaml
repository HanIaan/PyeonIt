components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 서버 세션 쿠키 (HttpOnly, SameSite=Lax). `/api/admin/**` 는 추가로 ADMIN 역할 필요.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: XSRF-TOKEN 쿠키 값 또는 GET /api/csrf 의 token. GET/HEAD/OPTIONS 외 모든 요청에 필요.

  parameters:
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: 페이지 크기 (최대 100, 초과 시 400)
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ProviderPath:
      name: provider
      in: path
      required: true
      description: Spring registrationId (소문자). JSON 의 SocialProvider 는 대문자.
      schema: { type: string, enum: [kakao, google] }
    UniversityIdPath:
      name: universityId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DocumentIdPath:
      name: documentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PostIdPath:
      name: postId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    CommentIdPath:
      name: commentId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RegionQuery:
      name: region
      in: query
      schema: { $ref: '#/components/schemas/Region' }
    FavoritesOnlyQuery:
      name: favoritesOnly
      in: query
      description: true 면 관심학교만 (로그인 필요)
      schema: { type: boolean, default: false }

  responses:
    BadRequest:
      description: '`INVALID_REQUEST` 형식 오류, `VALIDATION_FAILED` 값 검증 실패(fieldErrors)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: '`UNAUTHORIZED` 로그인 필요'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: '`FORBIDDEN` 권한 없음, `CSRF_INVALID`, `SIGNUP_REQUIRED` 가입 대기 세션(principal 이름이 숫자 아님), `ACCOUNT_SUSPENDED` 정지 회원 쓰기'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: '`REPLY_DEPTH_EXCEEDED`, `INVALID_REFERENCE`(없는 게시판·학교, 남의/이미 연결된 이미지)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NicknameForbidden:
      description: '`NICKNAME_FORBIDDEN` 금지어(사칭 단어) 포함'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PayloadTooLarge:
      description: '`PAYLOAD_TOO_LARGE` 업로드 크기 초과'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: '`RATE_LIMITED` 요청이 너무 잦음'
      headers:
        Retry-After:
          description: 재시도까지 초
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ---------- 공통 ----------
    ErrorResponse:
      type: object
      required: [code, message, fieldErrors]
      properties:
        code:
          type: string
          description: 기계용 오류 코드 (README 코드 표)
          examples: [VALIDATION_FAILED]
        message:
          type: string
          description: 사용자에게 보여줄 수 있는 한국어 메시지
        fieldErrors:
          type: array
          description: VALIDATION_FAILED 일 때 필드별 오류, 그 외 빈 배열
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          examples: [nickname]
        message:
          type: string
    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-XSRF-TOKEN
        token: { type: string }
    UserSummary:
      type: object
      required: [id, nickname]
      properties:
        id: { type: integer, format: int64 }
        nickname:
          type: [string, 'null']
          description: 탈퇴 회원이면 null
    Region:
      type: string
      enum: [SEOUL, GYEONGGI, INCHEON]

    # ---------- 인증 ----------
    SocialProvider:
      type: string
      enum: [KAKAO, GOOGLE]
    Me:
      type: object
      required: [id, nickname, nicknameChangeableAt, role, status, suspendedUntil, socialAccounts, createdAt]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        nicknameChangeableAt:
          type: [string, 'null']
          format: date-time
          description: 다음 닉네임 변경 가능 시각(nickname_changed_at + 30일). 변경 이력이 없으면 null(지금 변경 가능). 가입 시 최초 설정은 이력이 아니다

        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        suspendedUntil:
          type: [string, 'null']
          format: date-time
          description: SUSPENDED 일 때 종료 시각, 무기한(BAN)·ACTIVE 면 null
        socialAccounts:
          type: array
          items: { $ref: '#/components/schemas/SocialAccount' }
        createdAt: { type: string, format: date-time }
    SocialAccount:
      type: object
      required: [provider, linkedAt]
      properties:
        provider: { $ref: '#/components/schemas/SocialProvider' }
        linkedAt: { type: string, format: date-time }
    NicknameRequest:
      type: object
      description: |
        가입·변경 공통 닉네임 규칙.
        - 형식: 2~12자, 한글·영문·숫자만(`^[가-힣a-zA-Z0-9]{2,12}$`). 위반 시 400 `VALIDATION_FAILED`(fieldErrors[nickname]).
        - 중복 불가, 대소문자 무시(lower(nickname) 유니크). 위반 시 409 `NICKNAME_TAKEN`.
        - 금지어 포함 검사(대소문자 무시). 예: 운영자, 관리자, 편잇, pyeonit, admin. 전체 목록은 백엔드 설정. 위반 시 422 `NICKNAME_FORBIDDEN`.
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 12
          pattern: '^[가-힣a-zA-Z0-9]{2,12}$'
    NicknameChangeTooSoonError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [nicknameChangeableAt]
          properties:
            nicknameChangeableAt:
              type: string
              format: date-time
              description: 다음 변경 가능 시각
    SocialLinkStart:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          examples: [/oauth2/authorization/google]
    DevLoginRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          description: 개발용이라 닉네임 규칙(금지어 등)을 검사하지 않는다
          minLength: 2
          maxLength: 12
        role:
          type: string
          enum: [USER, ADMIN]
          default: USER
        suspended:
          type: boolean
          default: false
          description: true 이면 status=SUSPENDED 인 테스트 회원으로 로그인한다(role 과 조합 가능). 정지 회원 UI 테스트용이며 dev 프로필 전용으로 운영에는 존재하지 않는다.

    # ---------- 학교·공고 ----------
    UniversitySummary:
      type: object
      required: [id, name, campus, region]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        campus:
          type: string
          description: 단일 캠퍼스면 빈 문자열
        region: { $ref: '#/components/schemas/Region' }
    University:
      allOf:
        - $ref: '#/components/schemas/UniversitySummary'
        - type: object
          required: [admissionUrl, favorite]
          properties:
            admissionUrl: { type: [string, 'null'] }
            favorite:
              type: boolean
              description: 로그인 회원의 관심학교 여부 (미인증 false)
    UniversityDetail:
      allOf:
        - $ref: '#/components/schemas/University'
        - type: object
          required: [academicYears, guide]
          properties:
            academicYears:
              type: array
              items: { type: integer }
            guide:
              oneOf:
                - $ref: '#/components/schemas/AdmissionGuide'
                - type: 'null'
    AdmissionGuide:
      type: object
      description: 게시본(APPROVED 최신) 요강
      required: [documentId, academicYear, title, pageUrl, fileUrl, approvedAt, departments, schedules]
      properties:
        documentId: { type: integer, format: int64 }
        academicYear: { type: integer }
        title: { type: string }
        pageUrl:
          type: [string, 'null']
          description: 요강이 게시된 학교 페이지
        fileUrl:
          type: [string, 'null']
          description: 원본 PDF 링크(학교 사이트). 수동 업로드면 null
        approvedAt: { type: string, format: date-time }
        departments:
          type: array
          description: 단과대(COLLEGE) → 학과(MAJOR) 트리. 이 요강에 TO가 있는 모집단위와 그 상위만 포함
          items: { $ref: '#/components/schemas/DepartmentNode' }
        schedules:
          type: array
          items: { $ref: '#/components/schemas/Schedule' }
    DepartmentNode:
      type: object
      required: [id, level, name, previousDepartmentId, quotas, children]
      properties:
        id: { type: integer, format: int64 }
        level:
          type: string
          enum: [COLLEGE, MAJOR]
        name: { type: string }
        previousDepartmentId:
          type: [integer, 'null']
          format: int64
          description: 학과명 변경 시 전년도 학과
        quotas:
          type: array
          description: 이 단위로 모집하는 TO (단과대 단위 모집이면 COLLEGE 노드에 있음)
          items: { $ref: '#/components/schemas/Quota' }
        children:
          type: array
          items: { $ref: '#/components/schemas/DepartmentNode' }
    Track:
      type: object
      description: 표준 전형
      required: [id, code, name]
      properties:
        id: { type: integer, format: int32 }
        code:
          type: string
          examples: [GENERAL]
        name:
          type: string
          examples: [일반편입]
    Quota:
      type: object
      description: |
        TO. EXACT: count 확정. RANGE: "1명 이내"·"약간명" 등 count=null. NOT_RECRUITING: 미선발 count=0.
      required: [id, track, rawTrackName, kind, count, rawText]
      properties:
        id: { type: integer, format: int64 }
        track:
          description: 표준 전형. 매핑 안 됐으면 null(rawTrackName 으로 표시)
          oneOf:
            - $ref: '#/components/schemas/Track'
            - type: 'null'
        rawTrackName:
          type: string
          description: 원문 전형명 (같은 표준 전형이 여러 열일 수 있음)
        kind:
          type: string
          enum: [EXACT, RANGE, NOT_RECRUITING]
        count:
          type: [integer, 'null']
          minimum: 0
        rawText:
          type: string
          description: 원문 표기 (예 "3", "약간명")
    ScheduleType:
      type: string
      enum: [APPLICATION, DOCUMENT_SUBMISSION, EXAM, INTERVIEW, RESULT_FIRST_STAGE, RESULT_FINAL, REGISTRATION, ADDITIONAL, OTHER]
    Schedule:
      type: object
      required: [id, type, rawLabel, startsAt, endsAt, allDay, note]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/ScheduleType' }
        rawLabel: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt:
          type: [string, 'null']
          format: date-time
        allDay:
          type: boolean
          description: 시각 없이 날짜만 공지됨 (startsAt 의 날짜만 의미 있음, Asia/Seoul 기준)
        note: { type: [string, 'null'] }
    CalendarEvent:
      allOf:
        - $ref: '#/components/schemas/Schedule'
        - type: object
          required: [documentId, academicYear, university]
          properties:
            documentId: { type: integer, format: int64 }
            academicYear: { type: integer }
            university: { $ref: '#/components/schemas/UniversitySummary' }
    NoticeSummary:
      type: object
      required: [documentId, university, academicYear, title, approvedAt, applicationStartsAt, applicationEndsAt, pageUrl, fileUrl]
      properties:
        documentId: { type: integer, format: int64 }
        university: { $ref: '#/components/schemas/UniversitySummary' }
        academicYear: { type: integer }
        title: { type: string }
        approvedAt: { type: string, format: date-time }
        applicationStartsAt:
          type: [string, 'null']
          format: date-time
          description: APPLICATION 일정 시작 (없으면 null)
        applicationEndsAt:
          type: [string, 'null']
          format: date-time
        pageUrl: { type: [string, 'null'] }
        fileUrl:
          type: [string, 'null']
          description: 원본 PDF 링크
    NoticePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/NoticeSummary' }

    # ---------- 관리자 요강 ----------
    DocumentStatus:
      type: string
      enum: [DETECTED, EXTRACTED, NEEDS_REVIEW, APPROVED, REJECTED, FAILED]
    ExtractionRun:
      type: object
      required: [id, model, result, validation, error, createdAt]
      properties:
        id: { type: integer, format: int64 }
        model: { type: string }
        result:
          type: [object, 'null']
          description: AI 추출 원본(JSONB 그대로, 크롤러 스키마 crawler/src/pyeonit_crawler/schema.py)
          additionalProperties: true
        validation:
          type: [object, 'null']
          description: 합계 검증 결과(JSONB 그대로)
          additionalProperties: true
        error: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AdminDocument:
      type: object
      required: [id, university, academicYear, title, status, pageUrl, fileUrl, detectedAt, reviewedBy, reviewedAt, latestExtraction]
      properties:
        id: { type: integer, format: int64 }
        university: { $ref: '#/components/schemas/UniversitySummary' }
        academicYear: { type: integer }
        title: { type: string }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        pageUrl: { type: [string, 'null'] }
        fileUrl:
          type: [string, 'null']
          description: 원본 PDF 링크
        detectedAt: { type: string, format: date-time }
        reviewedBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        reviewedAt:
          type: [string, 'null']
          format: date-time
        latestExtraction:
          description: 가장 최근 추출 이력 (없으면 null)
          oneOf:
            - $ref: '#/components/schemas/ExtractionRun'
            - type: 'null'
    AdminDocumentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AdminDocument' }
    ApproveDocumentRequest:
      type: object
      required: [extractionRunId]
      properties:
        extractionRunId:
          type: integer
          format: int64
          description: 반영할 추출 이력 (보통 latestExtraction.id)

    # ---------- 커뮤니티 ----------
    Board:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, format: int32 }
        code:
          type: string
          examples: [QUESTION]
        name: { type: string }
    PostSummary:
      type: object
      required: [id, board, title, author, universities, viewCount, likeCount, commentCount, hasImages, createdAt]
      properties:
        id: { type: integer, format: int64 }
        board: { $ref: '#/components/schemas/Board' }
        title: { type: string }
        author: { $ref: '#/components/schemas/UserSummary' }
        universities:
          type: array
          description: 학교 태그
          items: { $ref: '#/components/schemas/UniversitySummary' }
        viewCount: { type: integer }
        likeCount: { type: integer }
        commentCount: { type: integer }
        hasImages: { type: boolean }
        createdAt: { type: string, format: date-time }
    PostDetail:
      allOf:
        - $ref: '#/components/schemas/PostSummary'
        - type: object
          required: [body, images, likedByMe, mine, updatedAt]
          properties:
            body:
              type: string
              description: 일반 텍스트 (HTML 아님)
            images:
              type: array
              items: { $ref: '#/components/schemas/PostImage' }
            likedByMe: { type: boolean }
            mine:
              type: boolean
              description: 내가 쓴 글 (수정·삭제 버튼 표시용)
            updatedAt: { type: string, format: date-time }
    PostPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/PostSummary' }
    PostWriteRequest:
      type: object
      required: [boardId, title, body]
      properties:
        boardId: { type: integer, format: int32 }
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 20000
        universityIds:
          type: array
          maxItems: 5
          uniqueItems: true
          default: []
          items: { type: integer, format: int64 }
        imageIds:
          type: array
          description: 순서가 sort_order 가 된다
          maxItems: 10
          uniqueItems: true
          default: []
          items: { type: integer, format: int64 }
    PostImage:
      type: object
      required: [id, url, contentType, sizeBytes]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
        sizeBytes: { type: integer }
    Comment:
      type: object
      required: [id, postId, parentId, author, body, status, mine, createdAt, updatedAt, replies]
      properties:
        id: { type: integer, format: int64 }
        postId: { type: integer, format: int64 }
        parentId:
          type: [integer, 'null']
          format: int64
        author:
          description: 삭제된 댓글이면 null
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        body:
          type: [string, 'null']
          description: 삭제된 댓글이면 null
        status:
          type: string
          enum: [PUBLISHED, DELETED]
        mine: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        replies:
          type: array
          description: 답글 (답글 자신의 replies 는 항상 빈 배열)
          items: { $ref: '#/components/schemas/Comment' }
    CommentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Comment' }
    CommentCreateRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
        parentId:
          type: [integer, 'null']
          format: int64
    CommentUpdateRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000
    LikeStatus:
      type: object
      required: [liked, likeCount]
      properties:
        liked: { type: boolean }
        likeCount: { type: integer }
    ReportTargetType:
      type: string
      enum: [POST, COMMENT, USER]
    ReportReason:
      type: string
      enum: [SPAM, ABUSE, ADVERTISEMENT, FALSE_INFO, OTHER]
    ReportStatus:
      type: string
      enum: [PENDING, RESOLVED, DISMISSED]
    ReportCreateRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: integer, format: int64 }
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail:
          type: [string, 'null']
          maxLength: 500
    ReportReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }

    # ---------- 관리자 신고·제재 ----------
    ReportTarget:
      type: object
      description: 신고 대상 미리보기 (글은 title, 댓글은 excerpt, 회원은 둘 다 null)
      required: [author, title, excerpt, status]
      properties:
        author:
          description: 글·댓글 작성자 또는 신고된 회원
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        title: { type: [string, 'null'] }
        excerpt:
          type: [string, 'null']
          description: 본문 앞 200자
        status:
          type: [string, 'null']
          description: 글·댓글 status(PUBLISHED|HIDDEN|DELETED), 회원은 null
    AdminReport:
      type: object
      required: [id, reporter, targetType, targetId, target, reason, detail, status, createdAt, handledBy, handledAt]
      properties:
        id: { type: integer, format: int64 }
        reporter: { $ref: '#/components/schemas/UserSummary' }
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: integer, format: int64 }
        target: { $ref: '#/components/schemas/ReportTarget' }
        reason: { $ref: '#/components/schemas/ReportReason' }
        detail: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string, format: date-time }
        handledBy:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        handledAt:
          type: [string, 'null']
          format: date-time
    AdminReportPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/AdminReport' }
    ReportHandleRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [RESOLVE, DISMISS]
        hideTarget:
          type: boolean
          default: false
    SanctionType:
      type: string
      enum: [WARNING, SUSPEND, BAN]
    Sanction:
      type: object
      required: [id, user, type, reason, startsAt, endsAt, active, createdBy, createdAt]
      properties:
        id: { type: integer, format: int64 }
        user: { $ref: '#/components/schemas/UserSummary' }
        type: { $ref: '#/components/schemas/SanctionType' }
        reason: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt:
          type: [string, 'null']
          format: date-time
          description: null = 무기한
        active:
          type: boolean
          description: startsAt <= now < coalesce(endsAt, ∞), WARNING 은 항상 false
        createdBy: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
    SanctionPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/Sanction' }
    SanctionCreateRequest:
      type: object
      required: [userId, type, reason]
      properties:
        userId: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/SanctionType' }
        reason:
          type: string
          minLength: 1
          maxLength: 500
        endsAt:
          type: [string, 'null']
          format: date-time
          description: SUSPEND 필수, WARNING·BAN 은 null
