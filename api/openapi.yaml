openapi: 3.1.0
info:
  title: PyeonIt API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    편입 준비생 커뮤니티 PyeonIt의 v0(1·2차 기능) API 계약. 자세한 규칙은 api/README.md.

    - 인증: 서버 세션 쿠키 `JSESSIONID`(HttpOnly, SameSite=Lax). 로그인은 OAuth2(카카오·구글) 브라우저 리다이렉트.
    - CSRF: Spring `CookieCsrfTokenRepository`. 서버가 `XSRF-TOKEN` 쿠키(HttpOnly 아님)를 내려주고,
      클라이언트는 GET/HEAD/OPTIONS 외 모든 요청에 같은 값을 `X-XSRF-TOKEN` 헤더로 보낸다.
      쿠키를 읽을 수 없는 환경이면 `GET /api/csrf` 응답 본문의 토큰을 쓴다. 불일치·누락은 403 `CSRF_INVALID`.
    - 오리진: 개발 시 웹 http://localhost:3000 → 백엔드 http://localhost:8081 를 CORS(자격 증명 포함)로 직접 호출한다.
      허용 오리진은 `PYEONIT_CORS_ALLOWED_ORIGINS`(쉼표 구분)로 덮어쓴다. 운영도 웹과 API는 같은 사이트(eTLD+1)여야 한다(SameSite=Lax).
    - 공개 범위: 미인증 사용자는 공고·캘린더·학교·게시판 읽기(GET) 가능, 쓰기는 로그인 필요, `/api/admin/**` 는 ADMIN 전용.
    - 공개 API는 APPROVED 요강만 노출한다. 학교·학년도별로 가장 최근에 승인된(reviewedAt 최신) APPROVED 요강이 게시본이며,
      DETECTED/EXTRACTED/NEEDS_REVIEW/REJECTED/FAILED 요강과 그 추출 결과는 관리자 API에서만 보인다.
    - 페이지네이션: page/size(0-base) 하나로 통일. 응답은 `content` + `page`·`size`·`totalElements`·`totalPages`.
    - 날짜·시각은 ISO-8601 UTC 오프셋 포함(`2026-11-08T09:00:00+09:00`), ID는 정수(int64).
    - 이름 규칙: DB 컬럼은 snake_case, JSON 필드는 camelCase(`academic_year` → `academicYear`). enum 값은 DB 값 그대로 대문자.
    - 오류는 모두 `ErrorResponse` 형식. 상태 코드 사용 규칙과 코드 표는 README.

    확장 필드: `x-owner`(구현 담당 B1|B2|B3|B4), `x-profile`(해당 프로필에서만 존재),
    `x-suspended-blocked: true`(SUSPENDED 회원은 403 `ACCOUNT_SUSPENDED`), `x-implemented-by`(담당과 다른 작업이 이미 구현).
servers:
  - url: http://localhost:8081
    description: 로컬 백엔드
tags:
  - name: auth
    description: 로그인·회원 (B1)
  - name: universities
    description: 학교·요강 (B2)
  - name: notices
    description: 공고·캘린더 (B2)
  - name: favorites
    description: 관심학교 (B2)
  - name: admin-documents
    description: 관리자 요강 검수 (B2)
  - name: community
    description: 게시판·글·댓글 (B3)
  - name: admin-community
    description: 관리자 신고·제재 (B4)

paths:
  # ===================== 인증 (B1) =====================
  /oauth2/authorization/{provider}:
    get:
      operationId: startOAuth2Login
      tags: [auth]
      x-owner: B1
      summary: OAuth2 로그인 시작 (브라우저 이동)
      description: |
        Spring Security 기본 엔드포인트. fetch가 아니라 `window.location` 으로 이동한다.
        제공자 콜백은 `/login/oauth2/code/{provider}`(제공자 콘솔에 등록).
        성공 시 웹으로 302: 기존 회원은 `{WEB}/`, 닉네임 미설정(가입 대기)이면 `{WEB}/signup`.
        실패 시 `{WEB}/login?error={code}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderPath'
      responses:
        '302':
          description: 제공자 인가 페이지로 리다이렉트
          headers:
            Location:
              schema: { type: string }
        '404':
          $ref: '#/components/responses/NotFound'

  /api/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      x-owner: B1
      x-implemented-by: C0
      summary: CSRF 토큰 조회
      description: '`XSRF-TOKEN` 쿠키도 함께 설정한다. 쿠키를 읽을 수 있으면 호출할 필요 없다.'
      security: []
      responses:
        '200':
          description: 토큰
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }

  /api/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-owner: B1
      x-implemented-by: C0
      summary: 로그아웃
      description: 세션을 무효화하고 XSRF-TOKEN 쿠키를 지운다. 로그인 상태가 아니어도 204.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: 로그아웃됨
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/signup:
    post:
      operationId: completeSignup
      tags: [auth]
      x-owner: B1
      summary: 첫 로그인 닉네임 설정(가입 완료)
      description: |
        OAuth2 로그인은 됐지만 회원이 아닌 가입 대기 세션에서만 호출한다(users.nickname NOT NULL이므로 이 호출에서 users 행을 만든다).
        성공하면 세션 principal 이름이 `pending:<provider>:<providerUserId>` 에서 users.id 숫자로 교체된다.
        닉네임 규칙은 `NicknameRequest` 참고(PATCH /api/me/nickname 과 같다). 가입 시 최초 설정은 30일 변경 제한 대상이 아니며 제한 시계도 시작하지 않는다.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NicknameRequest' }
      responses:
        '201':
          description: 가입 완료, 세션이 회원 세션으로 바뀜
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`NICKNAME_TAKEN` 닉네임 중복(대소문자 무시), `ALREADY_REGISTERED` 이미 회원'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/NicknameForbidden'

  /api/me:
    get:
      operationId: getMe
      tags: [auth]
      x-owner: B1
      summary: 내 정보
      description: 가입 대기 세션(principal 이름 `pending:<provider>:<providerUserId>`, 숫자 아님)이면 403 `SIGNUP_REQUIRED`.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: withdraw
      tags: [auth]
      x-owner: B1
      summary: 회원 탈퇴
      description: |
        LAST_SOCIAL_ACCOUNT 규칙과 무관하게 항상 가능하다. users.nickname=NULL, status=WITHDRAWN, withdrawn_at=now() 기록,
        social_accounts 전부 삭제, 세션 무효화. 작성한 글·댓글은 남고 작성자 닉네임이 null로 보인다.
        같은 소셜 계정으로 다시 로그인하면 새 가입이다.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204':
          description: 탈퇴됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/me/nickname:
    patch:
      operationId: changeNickname
      tags: [auth]
      x-owner: B1
      summary: 닉네임 변경 (30일에 1회)
      description: |
        규칙은 `NicknameRequest` 참고. 마지막 변경(users.nickname_changed_at) 후 30일이 지나야 다시 바꿀 수 있다.
        가입 시 최초 설정은 이 제한에 들어가지 않는다(변경 이력이 없으면 바로 변경 가능). 정지(SUSPENDED) 회원도 가능.
        현재와 같은 닉네임(대소문자까지 동일)이면 아무것도 바꾸지 않고 200.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NicknameRequest' }
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`NICKNAME_TAKEN` 닉네임 중복(대소문자 무시)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/NicknameForbidden'
        '429':
          description: '`NICKNAME_CHANGE_TOO_SOON` 마지막 변경 후 30일 이내'
          headers:
            Retry-After:
              description: 변경 가능까지 초
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NicknameChangeTooSoonError' }

  /api/me/social-accounts/{provider}:
    post:
      operationId: startSocialLink
      tags: [auth]
      x-owner: B1
      summary: 소셜 계정 연결 시작
      description: |
        세션에 연결 의도를 기록하고 이동할 인가 URL을 돌려준다(CSRF로 보호된 POST라 로그인 CSRF로 남의 계정이 연결되지 않는다).
        웹은 `authorizationUrl` 로 이동하고, 완료 후 `{WEB}/me?linked={provider}` 또는 `{WEB}/me?linkError={code}` 로 돌아온다.
        linkError: `SOCIAL_ACCOUNT_IN_USE`(다른 회원에 연결됨), `PROVIDER_ALREADY_LINKED`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ProviderPath'
      responses:
        '200':
          description: 이동할 URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocialLinkStart' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`PROVIDER_ALREADY_LINKED` 이미 이 제공자가 연결됨'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      operationId: unlinkSocialAccount
      tags: [auth]
      x-owner: B1
      summary: 소셜 계정 연결 해제
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ProviderPath'
      responses:
        '204':
          description: 해제됨
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`LAST_SOCIAL_ACCOUNT` 마지막 남은 로그인 수단은 해제 불가(탈퇴 DELETE /api/me 는 이 규칙과 무관하게 전부 삭제)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/dev/login:
    post:
      operationId: devLogin
      tags: [auth]
      x-owner: B1
      x-profile: dev
      summary: 테스트 로그인 (dev 프로필 전용)
      description: dev 프로필에서만 등록된다. 닉네임으로 회원을 찾고 없으면 만든 뒤 세션을 연다. 다른 프로필에서는 404.
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevLoginRequest' }
      responses:
        '200':
          description: 로그인됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===================== 학교·공고 (B2) =====================
  /api/universities:
    get:
      operationId: listUniversities
      tags: [universities]
      x-owner: B2
      summary: 학교 목록 (페이지네이션 없음, 전체)
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RegionQuery'
      responses:
        '200':
          description: 이름순 학교 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/University' }
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/universities/{universityId}:
    get:
      operationId: getUniversity
      tags: [universities]
      x-owner: B2
      summary: 학교 상세 (학년도별 요강·TO·일정)
      description: |
        `guide` 는 요청한 학년도(생략 시 APPROVED 요강이 있는 가장 최근 학년도)의 게시본. 없으면 null.
        `academicYears` 는 APPROVED 요강이 있는 학년도(내림차순).
      security:
        - {}
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UniversityIdPath'
        - name: academicYear
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200':
          description: 학교 상세
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UniversityDetail' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/notices:
    get:
      operationId: listNotices
      tags: [notices]
      x-owner: B2
      summary: 공고 목록
      description: |
        공고 = 학교·학년도별 게시본 요강(APPROVED 최신 1건). 정렬은 approvedAt 내림차순 고정.
        `favoritesOnly=true` 는 로그인 필요(미인증 401).
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: academicYear
          in: query
          schema: { type: integer, minimum: 2000, maximum: 2100 }
        - $ref: '#/components/parameters/RegionQuery'
        - $ref: '#/components/parameters/FavoritesOnlyQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 공고 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoticePage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/calendar:
    get:
      operationId: listCalendarEvents
      tags: [notices]
      x-owner: B2
      summary: 캘린더 (기간 조회)
      description: |
        게시본 요강의 일정 중 [from, to) 와 겹치는 것(startsAt < to AND coalesce(endsAt, startsAt) >= from), startsAt 오름차순.
        기간은 최대 100일(초과 400 `VALIDATION_FAILED`). 페이지네이션 없음.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/RegionQuery'
        - $ref: '#/components/parameters/FavoritesOnlyQuery'
        - name: universityId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: 일정 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalendarEvent' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/me/favorite-universities:
    get:
      operationId: listFavoriteUniversities
      tags: [favorites]
      x-owner: B2
      summary: 관심학교 목록 (추가한 순, 페이지네이션 없음)
      security:
        - sessionCookie: []
      responses:
        '200':
          description: 관심학교
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/University' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/me/favorite-universities/{universityId}:
    put:
      operationId: addFavoriteUniversity
      tags: [favorites]
      x-owner: B2
      summary: 관심학교 추가 (멱등)
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/UniversityIdPath'
      responses:
        '204':
          description: 추가됨(이미 있어도 204)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: removeFavoriteUniversity
      tags: [favorites]
      x-owner: B2
      summary: 관심학교 삭제 (멱등)
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/UniversityIdPath'
      responses:
        '204':
          description: 삭제됨(없어도 204)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===================== 관리자 요강 (B2) =====================
  /api/admin/admission-documents:
    get:
      operationId: listAdminAdmissionDocuments
      tags: [admin-documents]
      x-owner: B2
      summary: 승인 대기 요강 목록 (원본 PDF 링크 + 최신 추출 결과)
      description: status 생략 시 EXTRACTED·NEEDS_REVIEW. detectedAt 오름차순(오래된 것 먼저).
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/DocumentStatus' }
        - name: universityId
          in: query
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 요강 페이지
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDocumentPage' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/admission-documents/{documentId}/approve:
    post:
      operationId: approveAdmissionDocument
      tags: [admin-documents]
      x-owner: B2
      summary: 요강 승인
      description: |
        지정한 추출 결과(extraction_runs.result)를 departments·quotas·schedules 로 반영하고 status=APPROVED, reviewedBy·reviewedAt 기록.
