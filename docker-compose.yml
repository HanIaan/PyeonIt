# 로컬 개발용 DB
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pyeonit
      POSTGRES_USER: pyeonit
      POSTGRES_PASSWORD: pyeonit
    ports:
      - "5434:5432"  # 5432·5433은 로컬 다른 Postgres와 충돌 방지
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
