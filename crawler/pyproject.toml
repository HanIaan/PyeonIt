[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pyeonit-crawler"
version = "0.1.0"
description = "편입 모집요강 PDF 수집·추출·검증"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.48,<2",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
pyeonit-crawler = "pyeonit_crawler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: 실제 대학 사이트 또는 Gemini API가 필요한 테스트"]
addopts = "-m 'not network'"

[tool.hatch.build.targets.wheel]
packages = ["src/pyeonit_crawler"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
