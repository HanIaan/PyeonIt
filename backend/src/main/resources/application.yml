server:
  port: ${SERVER_PORT:8081}  # 이 맥은 8080을 다른 앱이 쓴다
spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/pyeonit}
    username: ${DB_USERNAME:pyeonit}
    password: ${DB_PASSWORD:pyeonit}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
pyeonit:
  community:
    orphan-image-retention: ${PYEONIT_COMMUNITY_ORPHAN_IMAGE_RETENTION:24h}
    orphan-image-cleanup-interval: ${PYEONIT_COMMUNITY_ORPHAN_IMAGE_CLEANUP_INTERVAL:1h}
    orphan-image-cleanup-enabled: ${PYEONIT_COMMUNITY_ORPHAN_IMAGE_CLEANUP_ENABLED:true}
  push:
    max-individual-notices: ${PYEONIT_PUSH_MAX_INDIVIDUAL_NOTICES:3}
    allowed-endpoint-host-suffixes: ${PYEONIT_PUSH_ALLOWED_ENDPOINT_HOST_SUFFIXES:fcm.googleapis.com,updates.push.services.mozilla.com,push.services.mozilla.com,notify.windows.com,push.apple.com}
    max-subscriptions-per-user: ${PYEONIT_PUSH_MAX_SUBSCRIPTIONS_PER_USER:10}
    vapid-public-key: ${PYEONIT_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${PYEONIT_PUSH_VAPID_PRIVATE_KEY:}
    vapid-subject: ${PYEONIT_PUSH_VAPID_SUBJECT:}
    scheduling-enabled: ${PYEONIT_PUSH_SCHEDULING_ENABLED:true}
    notice-interval-ms: ${PYEONIT_PUSH_NOTICE_INTERVAL_MS:60000}
    reminder-cron: ${PYEONIT_PUSH_REMINDER_CRON:0 0 9 * * *}
  # OAuth2 제공자. 키는 환경변수로만 넣는다. client-id 가 빈 제공자는 등록하지 않고, 전부 비면 oauth2Login 이 꺼진 채 뜬다(auth.OAuth2ClientConfig).
  # 형식은 spring.security.oauth2.client.* 와 같다. 콜백: {API}/login/oauth2/code/{kakao|google}
  oauth2:
    registration:
      kakao:
        client-id: ${KAKAO_CLIENT_ID:}
        client-secret: ${KAKAO_CLIENT_SECRET:}
        client-authentication-method: client_secret_post
        authorization-grant-type: authorization_code
        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        client-name: Kakao
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
    provider:
      kakao:
        authorization-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        user-info-uri: https://kapi.kakao.com/v2/user/me
        user-name-attribute: id  # 이메일은 받지 않는다
  nickname:
    # 사칭 금지어(포함 검사, 대소문자 무시). 쉼표 구분, PYEONIT_NICKNAME_FORBIDDEN_WORDS 로 덮어쓴다
    forbidden-words: ${PYEONIT_NICKNAME_FORBIDDEN_WORDS:운영자,관리자,운영진,운영팀,편잇,pyeonit,admin,official,공식}
  search:
    rate-limit:
      window: ${PYEONIT_SEARCH_RATE_LIMIT_WINDOW:60s}
      ip-requests: ${PYEONIT_SEARCH_RATE_LIMIT_IP_REQUESTS:60}
      session-requests: ${PYEONIT_SEARCH_RATE_LIMIT_SESSION_REQUESTS:30}
